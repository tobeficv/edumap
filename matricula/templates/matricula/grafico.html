{% extends 'matricula/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
  <h1 class="h3 mb-3">{{ titulo }}</h1>
  <!-- explicacion de la informacion -->
  <p>{{ explicacion }}</p>
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <img src="data:image/png;base64,{{ grafico }}" class="img-fluid rounded" alt="{{ alt }}">
    </div>
  </div>
  <a class="btn btn-outline-primary mt-3" href="{% url 'index' %}">Volver al inicio</a>
{% endblock %}
